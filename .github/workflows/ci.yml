name: CI - Validación y compilación

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Solo se necesita leer el repositorio para validar el código.
permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      # Recuperar el código que se debe validar.
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Usar Node.js 20 y aprovechar la caché de npm.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instalar las dependencias exactamente según package-lock.json.
      - name: Instalar dependencias
        run: npm ci

      # Compuerta RBAC: verificar guardas de rol y rutas administrativas (TASK-27 / CMP-05).
      - name: Verificar protección de rutas RBAC (CMP-05)
        run: node scripts/verify-rbac-routes.mjs

      # Compuerta PWA: verificar manifiesto, iconos instalables y Service Worker (TASK-31).
      - name: Verificar activos PWA y Service Worker
        run: |
          node -e "
            const fs = require('fs');
            const reqFiles = [
              'public/manifest.json',
              'public/sw.js',
              'public/icons/icon-192x192.png',
              'public/icons/icon-512x512.png',
              'public/icons/icon-maskable-512x512.png',
              'public/icons/apple-touch-icon.png'
            ];
            for (const f of reqFiles) {
              if (!fs.existsSync(f)) {
                console.error('Falta archivo PWA requerido:', f);
                process.exit(1);
              }
            }
            console.log('Activos PWA verificados correctamente.');
          "

      # Compuerta 1: calidad del código.
      - name: Validar lint
        run: npm run lint

      # Compuerta 2: comportamiento y pruebas automatizadas.
      - name: Ejecutar pruebas automatizadas
        run: npm run test

      # Compuerta 3: compilación de producción sin credenciales reales (sin ignoreBuildErrors).
      - name: Compilar aplicación de producción
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
